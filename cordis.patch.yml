# dsh-habit-miner — the Loader rows this bundle contributes.
#
# DSH reads `dsh.bundle.patch` from package.json, applies the rows below to the
# active profile, then loads the package by name. Install it from the in-app
# Plugins page (add a local directory) or with `dsh plugin add <dir>`; never
# hand-edit the profile's own patch file — a duplicate loader id stops DSH.
#
# `config:` holds this plugin's settings. Every field is optional; the empty
# object means "use the schema defaults". Settings can also be changed from the
# panel at runtime, which writes `config.json` next to the store.
- insert:
    - id: dsh-habit-miner
      name: 'dsh-habit-miner'
      config: {}
